name: RehabRunner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RehabRunner:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - target: RehabRunnerWatch
        embed: true
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Rehab Runner
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RehabRunner
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RehabRunnerWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Rehab Runner
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.RehabRunner
        WKBackgroundModes: [physical-therapy]
        NSMotionUsageDescription: "Czujniki ruchu zegarka służą do rozpoznawania ćwiczonego ruchu. Surowe dane nie są zapisywane."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RehabRunner.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
  RehabRunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RehabRunner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.RehabRunnerTests
schemes:
  RehabRunner:
    build:
      targets:
        RehabRunner: all
        RehabRunnerWatch: all
    test:
      targets: [RehabRunnerTests]
    run:
      config: Debug
  RehabRunnerWatch:
    build:
      targets:
        RehabRunnerWatch: all
    run:
      config: Debug
